<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Budget Pro</title>
    <!-- Lien vers le manifest pour l'installation -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Icônes pour l'interface -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Mon Budget</h1>
        <button id="settings-btn"><i class="fa-solid fa-gear"></i></button>
    </header>

    <!-- Modal Paramètres & Installation -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Paramètres</h2>
            <button id="install-btn" class="hidden">
                <i class="fa-solid fa-download"></i> Installer l'application
            </button>
            <p class="info-text">Utilisez ce bouton pour installer l'app sur votre écran d'accueil.</p>
            <button id="reset-data" class="danger-btn">Réinitialiser les données</button>
        </div>
    </div>

    <nav>
        <button class="tab-btn active" data-tab="provisions">Provisions</button>
        <button class="tab-btn" data-tab="reel">Dépenses Réelles</button>
        <button class="tab-btn" data-tab="global">Revenus & Fixes</button>
    </nav>

    <main>
        <!-- ONGLET 1: PROVISIONS (Prévisionnel) -->
        <section id="provisions" class="tab-content active">
            <h2>Anticipation du Mois</h2>
            <div class="input-group">
                <input type="text" id="prov-name" placeholder="Nom de la provision (ex: Loyer, Courses)">
                <input type="number" id="prov-amount" placeholder="Montant prévu (€)">
                <button id="add-prov-btn">Ajouter Provision</button>
            </div>
            <ul id="provisions-list" class="list-container">
                <!-- Liste générée par JS -->
            </ul>
            <div class="summary-box">
                <h3>Total Provisonné: <span id="total-prov">0 €</span></h3>
            </div>
        </section>

        <!-- ONGLET 2: DÉPENSES RÉELLES (Rapprochement) -->
        <section id="reel" class="tab-content">
            <h2>Suivi des Dépenses</h2>
            <div class="input-group">
                <select id="expense-category">
                    <option value="">Sélectionner une provision...</option>
                    <!-- Options générées dynamiquement depuis les provisions -->
                    <option value="unplanned">⚠️ Non Prévu</option>
                </select>
                <input type="text" id="real-desc" placeholder="Description (ex: Carrefour)">
                <input type="number" id="real-amount" placeholder="Montant réel (€)">
                <button id="add-real-btn">Ajouter Dépense</button>
            </div>
            
            <div class="stats-container">
                <div class="stat-card">
                    <small>Dépensé</small>
                    <span id="total-spent">0 €</span>
                </div>
                <div class="stat-card warning">
                    <small>Non Prévu</small>
                    <span id="total-unplanned">0 €</span>
                </div>
            </div>

            <ul id="real-expenses-list" class="list-container">
                <!-- Liste générée par JS -->
            </ul>
        </section>

        <!-- ONGLET 3: REVENUS, FIXES & EXCEPTIONNELS (Fusionné) -->
        <section id="global" class="tab-content">
            <h2>Revenus & Charges Fixes</h2>
            
            <div class="subsection">
                <h3>Revenus</h3>
                <div class="input-group">
                    <input type="text" id="inc-name" placeholder="Source (ex: Salaire)">
                    <input type="number" id="inc-amount" placeholder="Montant">
                    <button id="add-inc-btn">+</button>
                </div>
                <ul id="income-list"></ul>
            </div>

            <div class="subsection">
                <h3>Frais Fixes & Exceptionnels</h3>
                <div class="input-group">
                    <input type="text" id="fix-name" placeholder="Nom (ex: Assurance, Cadeau Noël)">
                    <input type="number" id="fix-amount" placeholder="Montant">
                    <label><input type="checkbox" id="is-exceptional"> Exceptionnel ?</label>
                    <button id="add-fix-btn">+</button>
                </div>
                <ul id="fixed-list"></ul>
            </div>

            <div class="summary-box global-summary">
                <p>Reste à vivre estimé: <span id="remaining-budget">Calcul...</span></p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
