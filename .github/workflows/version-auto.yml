name: Version automatique

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-auto
  cancel-in-progress: false

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer et inscrire la version
        run: |
          V="$(date -u +%Y%m%d%H%M%S)"
          sed -i -E "s|^const APP_VERSION[[:space:]]*=.*|const APP_VERSION = 'v${V}'; // version générée automatiquement|" app.js
          sed -i -E "s|^const CACHE[[:space:]]*=.*|const CACHE = 'budget-v${V}'; // version générée automatiquement|" sw.js

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js
          if git diff --cached --quiet; then
            echo "Version déjà à jour."
          else
            git commit -m "chore: version automatique [skip ci]"
            git pull --rebase origin main
            git push
          fi
